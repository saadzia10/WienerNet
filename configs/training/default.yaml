# Training schedule + optimiser setup.
num_epochs: 120
clip_grad_norm: null             # set a float to enable gradient clipping
nan_policy: raise                # 'raise' | 'skip'
log_every_n_steps: 50

optimizer:
  name: adam                     # 'adam' | 'adamw' | 'sgd'
  lr: 1.0e-3
  weight_decay: 0.0

scheduler:
  name: reduce_on_plateau        # 'reduce_on_plateau' | 'cosine' | 'none'
  patience: 10
  factor: 0.5
  mode: min

# Noise prior for the MMD-on-noise term (mmd_noise loss).
# kind: 'gaussian' matches noise to N(mean, std); 'empirical' matches to the
# train residual pool (NEE - NEE_phy), preserving the true skewed shape.
noise_prior:
  kind: gaussian                 # 'gaussian' | 'empirical'
  mean: null                     # (gaussian) null = use computed noise_mu
  std: null                      # (gaussian) null = use computed noise_std
  center: true                   # (empirical) de-mean the pool -> zero-mean target
