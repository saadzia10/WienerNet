# Training schedule + optimiser setup.
num_epochs: 120
clip_grad_norm: null             # set a float to enable gradient clipping
nan_policy: raise                # 'raise' | 'skip'
log_every_n_steps: 50

optimizer:
  name: adam                     # 'adam' | 'adamw' | 'sgd'
  lr: 1.0e-3
  weight_decay: 0.0

scheduler:
  name: reduce_on_plateau        # 'reduce_on_plateau' | 'cosine' | 'none'
  patience: 10
  factor: 0.5
  mode: min

# Noise prior for the MMD-on-noise term (mmd_noise loss).
# Set from data.noise_mu / data.noise_std at runtime; you can override here.
noise_prior:
  mean: null                     # null = use computed noise_mu
  std: null                      # null = use computed noise_std
