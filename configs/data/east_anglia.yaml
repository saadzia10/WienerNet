# Dataset config for the East Anglia flux towers.
# Override individual fields, e.g.:
#   python scripts/train.py data.batch_size=256 data.exclude_sites='[woodwalton]'
site_paths:
  redmere_1:  data_manipulation/other_sites/redmere_1/final_night_data.parquet
  redmere_2:  data_manipulation/other_sites/redmere_2/final_night_data.parquet
  great_fen:  data_manipulation/other_sites/great_fen/final_night_data.parquet
  rosedene:   data_manipulation/final_night_data.parquet
  # woodwalton is included by default (all training features present, ~17k
  # usable night rows; adding it is neutral-to-positive on the original sites).
  woodwalton: data_manipulation/other_sites/woodwalton/final_night_data.parquet
  # wicken_fen is NOT included: its raw data has no soil-temperature sensor, so
  # Tsoil1 (a required driver) is entirely absent. In a combined run every
  # wicken_fen row would be silently dropped (NaN Tsoil1); run alone it errors.
  # To use it you must first decide how to handle the missing Tsoil1 driver.
  # wicken_fen: data_manipulation/other_sites/wicken_fen/final_night_data.parquet

# Which subset to actually use. Leave include_sites empty to use all in site_paths.
include_sites: []
exclude_sites: []

# Driver columns + flags for feature concatenation
drivers: [Ta, H, Tau, RH, VPD, Rg, Ustar, Tsoil1]
include_season: true
include_time_vars: true
include_site_xyz: true

# Nighttime filter (input is already filtered to night, this is belt-and-braces)
nighttime_only: true
night_radiation_threshold: 20.0

# Ground-truth column names
nee_target_column: NEE_next
boundary_nee_column: NEE
e0_column: E0
rb_column: rb
temperature_column: Ta
dtemp_column: dTa
dnee_column: dNEE

# Time-scale of the increment the model is trained/evaluated on, in 30-min
# steps. null or 1 -> native 30-min. k>1 rescales targets (NEE_{t+k}, dNEE, dTa,
# dt) to a k*30-min step within each night (see wienernet.data.rescale). Set per
# run via the dt_scale_sweep experiment to train one model per scale.
time_step_k: null

# Split strategy
split_strategy: site_fraction    # 'site_fraction' | 'year' | 'site_holdout'
test_frac: 0.3
test_years: []                   # used if split_strategy=year, e.g. [2018, 2019]
holdout_site: null               # used if split_strategy=site_holdout: test = this site, train = rest
shuffle_split: false
split_random_state: 42

# Training-data subsampling for data-efficiency / learning-curve sweeps. null or
# 1.0 = use all training rows. Nested (fixed seed): a smaller fraction is a subset
# of a larger one. The test set is never subsampled.
train_subsample_frac: null
train_subsample_seed: 0

# Held-out validation split carved from the TRAINING sites, grouped by whole nights
# (site, window_id). When set, best.pth selection and the LR scheduler monitor THIS
# split instead of the held-out test site -- i.e. no test leakage in model selection.
# null (default) = legacy behaviour: the test loader is used as the val monitor.
val_frac: null
val_split_seed: 0

# DataLoader knobs
batch_size: 512
num_workers: 0
pin_memory: false
persistent_workers: false

# Where to save the fitted StandardScaler relative to the run dir
save_scaler_filename: scaler.pkl
