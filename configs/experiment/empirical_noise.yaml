# @package _global_
#
# Match the noise term to the *shape* of the real residual distribution instead
# of a parametric Gaussian: resample from the train-only residual pool
# (NEE - NEE_phy), de-meaned (center=true), so MMD matches a skewed/heavy-tailed
# shape with a zero-mean target and the deterministic head carries the location.
#
# Invoke:
#   python scripts/train.py experiment=empirical_noise           # single seed
#   python scripts/train.py -m experiment=empirical_noise        # 7-seed sweep
defaults:
  - override /model: piae_sde_sampling
  - override /loss: full

run_name: empirical_noise_seed${seed}

training:
  noise_prior:
    kind: empirical
    center: true

hydra:
  sweep:
    subdir: empirical_noise_seed${seed}
  sweeper:
    params:
      seed: 0,1,2,3,4,5,6
