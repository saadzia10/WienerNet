# @package _global_
#
# Increment-SDE VERSION B — non-residual, learned-mean noise.
#
#   dNEE = f_phys*dt + (mu(z) + eps*sigma(z))*sqrt(dt) ,  NEE_{t+1} = NEE_t + dNEE
# No residual head; the noise keeps a learned mean mu(z) so it absorbs the
# physics misfit, in increment form.
#
# The mmd_noise prior is left at the default (gaussian, non-centred) so the noise
# is allowed its learned mean.
#
# Invoke:
#   python scripts/train.py experiment=piae_increment                     # single seed
#   python scripts/train.py -m experiment=piae_increment                  # 7-seed sweep
defaults:
  - override /model: piae_increment
  - override /loss: increment

run_name: piae_increment_seed${seed}

hydra:
  sweep:
    subdir: piae_increment_seed${seed}
  sweeper:
    params:
      seed: 0,1,2,3,4,5,6
