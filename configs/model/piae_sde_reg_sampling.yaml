# Ablation: same architecture as piae_sde_sampling but does NOT add drift to nee_pred.
# The SDE term still trains via mse_drift loss but isn't used in the forecast path.
variant: piae_sde_reg_sampling

latent_dim: 32
encoder_dims: [16, 16]
decoder_dims: [16, 16]
activation: relu

latent_reparameterize: false
predict_drift: false             # nee_pred = bnee (no drift step)

heads:
  temp_derivative: true
  k: true
  k_activation: leaky_relu
  k_activation_slope: 0.01
  noise: true
  noise_zero_mean: false   # true -> noise = eps*sigma(z), zero conditional mean
  noise_dims: [4]

tref: 10.0
t0: 46.02

# Encoder-input composition — which GT quantities feed the encoder. Orthogonal to
# the heads above and to their anchor losses (mse_E0/mse_rb, mse_temp_derivative).
# CAVEAT: include_k=true while heads.k + mse_E0/mse_rb are on lets the k head
# trivially copy input->output — turn include_k off for a clean exogenous fit.
inputs:
  include_bnee: true             # boundary NEE in the encoder input
  include_k: true                # GT (E0, rb) in the encoder input
  include_dtemp: false           # GT dTa in the encoder input; drift always uses the PREDICTED dT/dt
  scale_extra_inputs: false      # true -> standardise k/dTa with train stats before concat

# (E0, rb) source for the analytic SDE drift: 'predicted' (k head) or
# 'ground_truth' (GT k fed straight into the physics). dT/dt is always predicted.
physics_k_source: predicted
