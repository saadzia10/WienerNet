# XGBoost baseline.
# Matches the original notebook's XGBRegressor(n_estimators=100).
variant: xgb
kind: sklearn                # signals scripts/train_baseline.py to use this

# Hyperparameters
n_estimators: 100
max_depth: 6
learning_rate: 0.3
subsample: 1.0
colsample_bytree: 1.0
reg_alpha: 0.0
reg_lambda: 1.0
n_jobs: -1
tree_method: hist
