# Vanilla autoencoder baseline. No physics, no noise head, no SDE drift.
variant: ae

latent_dim: 32
encoder_dims: [16, 16]
decoder_dims: [16, 16]
activation: relu

latent_reparameterize: false
predict_drift: false

heads:
  temp_derivative: false
  k: true
  k_activation: null               # use same activation as the rest
  noise: false

tref: 10.0
t0: 46.02

# Encoder-input composition — which GT quantities feed the encoder. include_dtemp
# has no temp head to compete with here; it just adds GT dTa as a plain feature.
# (physics_k_source is inert for the AE — there is no SDE drift.)
inputs:
  include_bnee: true             # boundary NEE in the encoder input
  include_k: true                # GT (E0, rb) in the encoder input
  include_dtemp: false           # GT dTa in the encoder input
  scale_extra_inputs: false      # true -> standardise k/dTa with train stats before concat
