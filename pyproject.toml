[build-system]
requires = ["setuptools >= 64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wienernet"
version = "0.2.0"
description = "Physics-informed autoencoder for nighttime CO₂ flux gap-filling"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Corentin Houpert" },
    { name = "Saad Zia" },
]
license = { text = "Research-only; license TBD" }

dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "fastparquet",
    "matplotlib",
    "seaborn",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.0",
    "rich",
    "dotmap",
    "termcolor",
    "tqdm",
    "tensorboard",
    "astral",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "nbformat",
    "ruff",
]

[project.scripts]
wienernet-train = "scripts.train:main"
wienernet-evaluate = "scripts.evaluate:main"
data-pipeline = "data_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["wienernet*", "data_pipeline*", "scripts*"]
exclude = ["tests*", ".archive*", "configs*", "notebooks*", "data_manipulation*"]
